name: Bug report
description: Report a reproducible problem with OneVerifyCode.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include verification codes, SMS bodies, phone numbers, or private screenshots. Mask anything sensitive.
  - type: input
    id: version
    attributes:
      label: OneVerifyCode version
      description: Find it on the About page or in the sidebar footer.
      placeholder: "0.5.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 14.6"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - pkg
        - dmg
        - Built from source
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions granted
      options:
        - label: Full Disk Access
        - label: Accessibility
        - label: Neither
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that triggers the issue.
      placeholder: |
        1. Forward a test SMS to this Mac
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove codes, message text, phone numbers, and account identifiers first.
      render: shell
