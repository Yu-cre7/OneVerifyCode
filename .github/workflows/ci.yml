name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on macOS
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          clang --version
          python3 --version

      - name: Run tests
        run: make test
